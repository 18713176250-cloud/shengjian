<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="声见本地视频项目：预览视频、查看信息并提取音频。">
  <title>项目详情 · 声见</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/project.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="声见首页">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span>声见</span>
    </a>
    <span class="phase-badge"><span class="status-dot"></span>第一阶段 · 本地处理</span>
  </header>

  <main class="project-main">
    <a class="back-link" href="/"><span aria-hidden="true">←</span> 返回全部项目</a>
    <div class="loading-state" id="page-loading">
      <span class="loading-spinner" aria-hidden="true"></span>
      <p>正在读取项目…</p>
    </div>
    <p class="message error-message hidden" id="page-error" role="alert"></p>

    <div id="project-content" class="hidden">
      <div class="project-title-row">
        <div><p class="eyebrow">LOCAL VIDEO PROJECT</p><h1 id="project-name"></h1></div>
        <span id="project-status"></span>
      </div>

      <div class="project-layout">
        <section class="video-panel" aria-label="视频预览">
          <video id="video-player" controls playsinline preload="metadata">你的浏览器不支持视频播放，请使用下载功能或更换浏览器。</video>
          <div class="video-caption"><span>原始视频预览</span><span>声音提取不会修改原视频</span></div>
        </section>
        <p class="message error-message hidden" id="video-error" role="alert"></p>

        <aside class="side-stack">
          <section class="info-card" aria-labelledby="info-title">
            <h2 id="info-title">视频信息</h2>
            <dl class="info-list">
              <div><dt>时长</dt><dd id="video-duration">—</dd></div>
              <div><dt>分辨率</dt><dd id="video-resolution">—</dd></div>
              <div><dt>文件大小</dt><dd id="video-size">—</dd></div>
              <div><dt>上传时间</dt><dd id="video-created">—</dd></div>
            </dl>
          </section>

          <section class="process-card" aria-labelledby="process-title">
            <h2 id="process-title">音频提取</h2>
            <p class="task-description">从原视频提取第一条音轨，供后续语音与声音事件处理使用。</p>
            <div class="task-specs" aria-label="音频输出规格"><span>WAV</span><span>16 kHz</span><span>单声道</span><span>PCM 16-bit</span></div>
            <button class="primary-button" id="extract-button" type="button">提取音频 <span aria-hidden="true">→</span></button>
            <p class="message error-message hidden" id="task-error" role="alert"></p>
            <div class="process-status"><span>真实任务状态</span><strong id="task-status">尚未创建任务</strong></div>
          </section>

          <section class="audio-card hidden" id="audio-card" aria-labelledby="audio-title">
            <h2 id="audio-title">音频已就绪</h2>
            <audio id="audio-player" controls preload="metadata">你的浏览器不支持音频播放。</audio>
            <a class="secondary-button" id="audio-download" href="#" download>下载 WAV 音频</a>
          </section>
        </aside>
      </div>
    </div>
  </main>

  <footer class="site-footer"><span>声见 · 本地项目工作区</span><span>暂不生成字幕或 AI 识别结果</span></footer>
</body>
</html>
